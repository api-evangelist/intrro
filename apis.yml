name: Intrro
description: Intrro is an employee referral recruiting platform that turns a company's collective
  network into a warm-introduction hiring engine. Its AI-assisted software analyzes employees'
  LinkedIn and email connections to surface candidates likely to be known across the team, then
  automates referral requests, gamified engagement, referral-bonus tracking, approvals and payouts
  from a single dashboard. Intrro integrates with major applicant tracking systems and collaboration
  tools including Greenhouse, Lever, Workday, iCIMS, Jobvite, Glassdoor, Slack and Microsoft Teams,
  and exposes API keys through an in-app Dev Center for those integrations. Founded in 2020 and backed
  by 500 Global, the company operates via Ehalah FZ-LLC and hosts its platform on AWS under
  GDPR-aligned data practices.
